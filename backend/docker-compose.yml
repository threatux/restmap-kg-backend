version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: restmap-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restmap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: restmap-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/restmap
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seeds.demo_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: